<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title> 生日尊贵vip专属庆典半手搓版☾☾☾☾☆☽☽☽☽之你会忘了我的荤豆花吗？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', system-ui;
        }
        #lockScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #a28fbf, #c2b0df);
            z-index: 1000;
            overflow: hidden;
        }
        #catCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            z-index: 10;
        }
        .lockBox {
            position: absolute;
            top: 32%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.96);
            padding: 18px 20px;
            border-radius: 35px;
            text-align: center;
            width: 230px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
            z-index: 30;
            backdrop-filter: blur(2px);
            pointer-events: auto;
            border: 1px solid rgba(255,240,210,0.6);
            transition: transform 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        .lockBox h2 {
            margin-bottom: 12px;
            color: #6b5b7e;
            font-size: 20px;
        }
        .lockBox input {
            width: 100%;
            padding: 9px 12px;
            font-size: 15px;
            border: 2px solid #e0d0f0;
            border-radius: 35px;
            text-align: center;
            margin-bottom: 14px;
            outline: none;
            background: #fffbf5;
            pointer-events: auto;
        }
        .lockBox button {
            background: #ff9a8b;
            background-image: linear-gradient(120deg, #ff9a8b, #ff6a88);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 35px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
            pointer-events: auto;
        }
        .lockBox button:active { transform: scale(0.96); }
        .errorMsg {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 12px;
            display: none;
        }
        .catHint {
            position: absolute;
            bottom: 22px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,240,0.9);
            background: rgba(0,0,0,0.3);
            width: fit-content;
            margin: 0 auto;
            padding: 4px 14px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            pointer-events: none;
            z-index: 35;
            font-weight: 500;
        }
        /* 密码框顶起动画 */
        .box-pop {
            animation: boxPopUp 0.28s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        @keyframes boxPopUp {
            0% { transform: translate(-50%, -50%) translateY(0px) rotate(0deg); }
            30% { transform: translate(-50%, -50%) translateY(-35px) rotate(1deg); }
            70% { transform: translate(-50%, -50%) translateY(-12px) rotate(-0.8deg); }
            100% { transform: translate(-50%, -50%) translateY(0px) rotate(0deg); }
        }
        /* 柔和光晕 */
        .impact-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
            transition: 0.15s;
            opacity: 0;
        }
        /* 粒子元素 */
        .pop-effect {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 25;
            opacity: 0;
            transition: opacity 0.05s;
        }
        #birthdayContent {
            width: 100%;
            height: 100%;
            position: relative;
            display: none;
        }
        .birthday-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        #hint {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,240,0.8);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 13px;
            color: #4a6a7a;
            pointer-events: none;
            z-index: 20;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="lockScreen">
    <canvas id="catCanvas"></canvas>
    <div class="lockBox" id="lockBox">
        <h2>🔐 你是哪只笨笨</h2>
        <input type="password" id="passwordInput" placeholder="如实交代" autocomplete="off">
        <button id="openDoorBtn"> 芝麻开门！</button>
        <div class="errorMsg" id="errorMsg">🐾 芝麻关门</div>
    </div>
    <div class="catHint">🐱 请摸摸小猫（摸一次一块钱）
特别鸣谢陈摸你赞助本项目一元钱</div>
    <div class="impact-flash" id="impactFlash"></div>
</div>

<div id="birthdayContent">
    <div id="hint">✨ 可以疯狂点击屏幕 ✨</div>
    <canvas id="birthdayCanvas" class="birthday-canvas"></canvas>
</div>

<script>
    // ========= 音频配置 =========
    // 请将您的音效文件（例如 meow.mp3）放在与 HTML 相同的目录下，并将下面的文件名改为您的文件名
    const CAT_SOUND_FILE = 'miao.m4A';   // 修改这里！改成您上传的音效文件名
    let catSound = null;
    // 预加载音频（为了更快响应）
    function initCatSound() {
        if (CAT_SOUND_FILE && CAT_SOUND_FILE !== 'meow.mp3') {
            catSound = new Audio(CAT_SOUND_FILE);
            // 移动端预加载
            catSound.preload = 'auto';
        }
    }
    // 播放摸猫音效
    function playCatSound() {
        if (!catSound) {
            // 如果没有配置音效，尝试创建（兼容默认）
            if (CAT_SOUND_FILE && CAT_SOUND_FILE !== 'meow.mp3') {
                catSound = new Audio(CAT_SOUND_FILE);
            } else {
                return; // 没有配置音效文件，不播放
            }
        }
        // 每次重新开始播放，避免重叠
        catSound.currentTime = 0;
        catSound.play().catch(e => console.log("音频播放失败（可能是用户未交互或文件不存在）:", e));
    }
    // 页面加载后初始化音频（用户点击任意位置后就可以播放，但为了安全我们在第一次摸猫时也尝试播放）
    initCatSound();
    
    (function sweetDreamCatButterflyJelly() {
        const canvas = document.getElementById('catCanvas');
        if (!canvas) return;
        let ctx = canvas.getContext('2d');
        let width, height;
        
        // 猫咪数据
        let cat = {
            x: 200, y: 0,
            targetX: 200,
            legPhase: 0,
            tailAngle: 0, tailDir: 1,
            earTwitch: 0,
            blink: 0, eyeClose: false,
            sitting: false, sitTimer: 0,
            bodyBob: 0,
            walkCycle: 0,
            fastWag: false,
            pawSwipe: 0,
            headAngle: 0,
            bodyShift: 0,
            watchingButterfly: false,
            interestIntensity: 0,
            bounce: 0,
            bounceOffset: 0
        };
        
        // 蝴蝶
        let butterfly = {
            x: 0, y: 0,
            targetX: 0, targetY: 0,
            state: 'follow',
            stateTimer: 0,
            angle: 0,
            radius: 150,
            freeTargetX: 0, freeTargetY: 0,
            vx: 0, vy: 0,
            floatOffset: 0,
            hovered: false
        };
        
        // 水母
        let jellyfish = {
            x: 0, y: 0,
            targetX: 0, targetY: 0,
            vx: 0, vy: 0,
            phase: 0,
            tentaclePhase: 0,
            floatY: 0,
            pulse: 0,
            hovered: false
        };
        
        let dots = [];
        let grasses = [];
        let flowers = [];
        
        let boxRect = { x: 0, y: 0, w: 230, h: 150 };
        let animationId = null;
        
        let mouseX = 0, mouseY = 0;
        
        function updateBoxRect() {
            const box = document.querySelector('.lockBox');
            if (box) {
                const rect = box.getBoundingClientRect();
                boxRect = { x: rect.left, y: rect.top, w: rect.width, h: rect.height };
            }
        }
        
        function isInsidePasswordBox(px, py) {
            return (px >= boxRect.x && px <= boxRect.x + boxRect.w && py >= boxRect.y && py <= boxRect.y + boxRect.h);
        }
        
        function applyAvoidForce(obj, x, y, strength = 0.5) {
            const centerX = boxRect.x + boxRect.w/2;
            const centerY = boxRect.y + boxRect.h/2;
            const dx = obj.x - centerX;
            const dy = obj.y - centerY;
            const dist = Math.hypot(dx, dy);
            const safeDist = 85;
            if (dist < safeDist && dist > 0.1) {
                const angle = Math.atan2(dy, dx);
                const force = (safeDist - dist) / safeDist * strength;
                obj.x += Math.cos(angle) * force * 1.0;
                obj.y += Math.sin(angle) * force * 1.0;
                if (obj.vx !== undefined) {
                    obj.vx += Math.cos(angle) * force * 0.2;
                    obj.vy += Math.sin(angle) * force * 0.2;
                }
            }
            if (obj === jellyfish && obj.y > boxRect.y + boxRect.h + 25) {
                obj.y = boxRect.y + boxRect.h + 15;
            }
        }
        
        function drawGrassAndFlowers() {
            const groundY = height - 42;
            const time = Date.now() * 0.004;
            for (let g of grasses) {
                const sway = Math.sin(time + g.x * 0.02) * 4;
                ctx.beginPath();
                ctx.moveTo(g.x, groundY);
                ctx.quadraticCurveTo(g.x - 4 + sway, groundY - 12, g.x + 2 + sway * 0.5, groundY - 16);
                ctx.moveTo(g.x, groundY);
                ctx.quadraticCurveTo(g.x + 5 - sway, groundY - 10, g.x + 3 - sway * 0.5, groundY - 18);
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#b5d48c";
                ctx.stroke();
            }
            for (let f of flowers) {
                ctx.fillStyle = f.color;
                ctx.beginPath();
                ctx.arc(f.x, groundY - 5, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#f5e68a";
                ctx.beginPath();
                ctx.arc(f.x, groundY - 7, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initBackgroundDots() {
            dots = [];
            const dotCount = 18;
            for (let i = 0; i < dotCount; i++) {
                let x = Math.random() * width;
                let y = Math.random() * height;
                let yFactor = 1 - (y / height) * 0.8;
                let alpha = 0.2 + yFactor * 0.5;
                dots.push({
                    x: x, y: y,
                    r: 2 + Math.random() * 2,
                    baseAlpha: Math.min(0.7, alpha),
                    alpha: alpha
                });
            }
        }
        
        function drawBackgroundDots() {
            const catPos = { x: cat.x, y: cat.y - 20 };
            const butterflyPos = { x: butterfly.x, y: butterfly.y };
            for (let d of dots) {
                let distToCat = Math.hypot(d.x - catPos.x, d.y - catPos.y);
                let distToButterfly = Math.hypot(d.x - butterflyPos.x, d.y - butterflyPos.y);
                let minDist = Math.min(distToCat, distToButterfly);
                let factor = 1;
                if (minDist < 100) {
                    factor = Math.max(0, (minDist - 20) / 80);
                    factor = Math.pow(factor, 1.2);
                }
                let finalAlpha = d.baseAlpha * factor;
                if (finalAlpha < 0.05) continue;
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 225, 170, ${finalAlpha * 0.7})`;
                ctx.fill();
            }
        }
        
        function drawButterfly() {
            const x = butterfly.x;
            const y = butterfly.y + Math.sin(Date.now() * 0.012) * 1.2;
            const wingFlap = Math.sin(Date.now() * 0.016) * 0.7;
            ctx.save();
            if (butterfly.hovered) {
                ctx.shadowBlur = 18;
                ctx.shadowColor = "rgba(255, 220, 150, 0.8)";
                ctx.beginPath();
                ctx.arc(x, y, 28, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 240, 180, 0.2)";
                ctx.fill();
            } else {
                ctx.shadowBlur = 5;
                ctx.shadowColor = "rgba(200, 130, 200, 0.4)";
            }
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x - 24 - wingFlap * 6, y - 20, x - 11, y);
            ctx.quadraticCurveTo(x - 22 - wingFlap * 3, y + 14, x, y);
            ctx.fillStyle = "#e6b0e6";
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x - 14 - wingFlap * 3, y - 12, x - 6, y);
            ctx.quadraticCurveTo(x - 12 - wingFlap * 2, y + 9, x, y);
            ctx.fillStyle = "#f7ccee";
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x + 24 + wingFlap * 6, y - 20, x + 11, y);
            ctx.quadraticCurveTo(x + 22 + wingFlap * 3, y + 14, x, y);
            ctx.fillStyle = "#f0b8e0";
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x + 14 + wingFlap * 3, y - 12, x + 6, y);
            ctx.quadraticCurveTo(x + 12 + wingFlap * 2, y + 9, x, y);
            ctx.fillStyle = "#ffe0c0";
            ctx.fill();
            ctx.fillStyle = "#f5dcb0";
            ctx.beginPath();
            ctx.ellipse(x, y, 3.2, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#b57c6e";
            ctx.beginPath();
            ctx.arc(x - 1.8, y - 3.5, 1.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#2c2c2c";
            ctx.beginPath();
            ctx.arc(x - 2, y - 4.5, 0.65, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x - 1, y - 8);
            ctx.quadraticCurveTo(x - 7, y - 15, x - 12, y - 13);
            ctx.moveTo(x + 1, y - 8);
            ctx.quadraticCurveTo(x + 7, y - 15, x + 12, y - 13);
            ctx.lineWidth = 1;
            ctx.strokeStyle = "#ab8e5c";
            ctx.stroke();
            ctx.restore();
        }
        
        function drawJellyfish() {
            const x = jellyfish.x;
            const y = jellyfish.y + Math.sin(jellyfish.floatY) * 2.2;
            const pulse = 0.9 + Math.sin(jellyfish.pulse) * 0.07;
            ctx.save();
            if (jellyfish.hovered) {
                ctx.shadowBlur = 22;
                ctx.shadowColor = "rgba(210, 180, 255, 0.9)";
                ctx.beginPath();
                ctx.arc(x, y, 36, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(210, 180, 255, 0.2)";
                ctx.fill();
            } else {
                ctx.shadowBlur = 8;
                ctx.shadowColor = "rgba(170, 130, 200, 0.5)";
            }
            const grad = ctx.createLinearGradient(x - 18, y - 12, x + 18, y + 10);
            grad.addColorStop(0, "#e0c0f0");
            grad.addColorStop(1, "#d4aae0");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(x, y, 28 * pulse, 17 * pulse, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(245, 225, 255, 0.7)";
            ctx.beginPath();
            ctx.ellipse(x, y - 2, 20 * pulse, 11 * pulse, 0, 0, Math.PI * 2);
            ctx.fill();
            for (let i = 0; i < 7; i++) {
                const angle = (i / 7) * Math.PI * 2;
                const offX = Math.cos(angle) * 12;
                const phaseOff = i * 0.6;
                ctx.beginPath();
                ctx.moveTo(x + offX, y + 5);
                let cx = x + offX + Math.sin(Date.now() * 0.0028 + phaseOff) * 4;
                let cy = y + 14 + Math.cos(Date.now() * 0.0033 + phaseOff) * 3;
                let cx2 = x + offX * 0.6 + Math.sin(Date.now() * 0.0022 + phaseOff + 1) * 3;
                let cy2 = y + 26 + Math.cos(Date.now() * 0.003 + phaseOff) * 4;
                ctx.quadraticCurveTo(cx, cy, cx2, cy2);
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = `rgba(200, 150, 210, 0.85)`;
                ctx.stroke();
            }
            ctx.beginPath();
            ctx.ellipse(x, y - 1, 14, 8, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 240, 255, 0.6)";
            ctx.fill();
            ctx.restore();
        }
        
        function drawCat() {
            const x = cat.x;
            let bounceY = cat.bounce > 0 ? cat.bounceOffset : 0;
            const yBase = cat.y + (cat.sitting ? 6 : 0) + cat.bodyBob * 0.6 + bounceY;
            const y = Math.min(height - 45, yBase);
            ctx.save();
            
            ctx.beginPath();
            ctx.moveTo(x - 22, y + 4);
            let tailSway = Math.sin(Date.now() * 0.008) * 0.7;
            if (cat.sitting) tailSway *= 1.4;
            if (cat.watchingButterfly) tailSway += 0.3;
            ctx.quadraticCurveTo(x - 38 + tailSway * 12, y - 8 + tailSway * 2, x - 52 + tailSway * 16, y + 2);
            ctx.lineWidth = 10;
            ctx.strokeStyle = "#f5f6fc";
            ctx.stroke();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#cbcbd4";
            ctx.stroke();
            
            let bodyOffsetX = cat.headAngle * 3;
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.ellipse(x + bodyOffsetX * 0.3, y, 36, 28, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fef6e6";
            ctx.beginPath();
            ctx.ellipse(x - 5 + bodyOffsetX * 0.2, y + 2, 18, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            
            const legSwing = cat.sitting ? 0 : Math.sin(cat.legPhase) * 5;
            ctx.fillStyle = "#fefefe";
            ctx.beginPath();
            ctx.ellipse(x - 16 + bodyOffsetX * 0.2, y + 12 + legSwing * 0.4, 9, 13, -0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + 8 + bodyOffsetX * 0.3, y + 12 + legSwing * 0.6, 9, 13, 0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x - 20 + bodyOffsetX * 0.1, y + 6, 10, 13, -0.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + 18 + bodyOffsetX * 0.4, y + 6, 10, 13, 0.1, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.save();
            ctx.translate(x + bodyOffsetX * 0.5, y - 10);
            ctx.rotate(cat.headAngle * 0.45);
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.ellipse(0, 0, 22, 20, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffe1ed";
            ctx.beginPath();
            ctx.moveTo(-24, -12);
            ctx.lineTo(-38, -28);
            ctx.lineTo(-16, -18);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(24, -12);
            ctx.lineTo(38, -28);
            ctx.lineTo(16, -18);
            ctx.fill();
            ctx.fillStyle = "#ffb7c5";
            ctx.beginPath();
            ctx.moveTo(-24, -14);
            ctx.lineTo(-34, -25);
            ctx.lineTo(-19, -18);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(24, -14);
            ctx.lineTo(34, -25);
            ctx.lineTo(19, -18);
            ctx.fill();
            
            let eyeCloseTmp = cat.eyeClose;
            let eyeStyle = 0;
            if (cat.bounce > 0) eyeStyle = 1;
            ctx.fillStyle = "#2e2c38";
            if (eyeStyle === 1) {
                ctx.beginPath();
                ctx.moveTo(-16, -6);
                ctx.lineTo(-10, -9);
                ctx.lineTo(-10, -5);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(16, -6);
                ctx.lineTo(10, -9);
                ctx.lineTo(10, -5);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.arc(-13, -5, 4.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(13, -5, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.arc(-15, -8, 1.7, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(11, -7.5, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            if (cat.eyeClose && eyeStyle === 0) {
                ctx.fillStyle = "#2e2c38";
                ctx.beginPath();
                ctx.ellipse(-13, -4.5, 4.8, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(13, -4.5, 4.5, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = "#ffaa88";
            if (eyeStyle === 1) {
                ctx.beginPath();
                ctx.arc(0, 5, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#cc7755";
                ctx.beginPath();
                ctx.arc(-1, 4, 1, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.ellipse(0, 4, 3.8, 2.8, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.beginPath();
            ctx.moveTo(-25, 2);
            ctx.lineTo(-44, -2);
            ctx.moveTo(-25, 5);
            ctx.lineTo(-44, 5);
            ctx.moveTo(25, 2);
            ctx.lineTo(44, -2);
            ctx.moveTo(25, 5);
            ctx.lineTo(44, 5);
            ctx.strokeStyle = "#b0aab5";
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.restore();
            
            if (cat.pawSwipe > 0) {
                ctx.fillStyle = "rgba(255,210,180,0.8)";
                ctx.beginPath();
                ctx.ellipse(x - 20 + (12 - cat.pawSwipe) * 1.5, y + 8 + Math.sin(cat.pawSwipe) * 3, 9, 6, -0.4, 0, Math.PI * 2);
                ctx.fill();
            }
            if (cat.sitting) {
                ctx.font = "18px 'Segoe UI'";
                ctx.fillStyle = "rgba(255,200,210,0.9)";
                ctx.fillText("💕", x - 8, y - 32);
            }
            if (cat.bounce > 0) {
                ctx.font = "24px 'Segoe UI'";

        function updateCatMovement() {
            if (cat.bounce > 0) {
                cat.bounce--;
                let t = 1 - cat.bounce / 12;
                let offset = -Math.sin(t * Math.PI) * 28;
                cat.bounceOffset = offset;
                if (cat.bounce === 0) cat.bounceOffset = 0;
            } else {
                cat.bounceOffset = 0;
            }
            
            const dxToButter = butterfly.x - cat.x;
            const dyToButter = butterfly.y - (cat.y - 28);
            const distToButter = Math.hypot(dxToButter, dyToButter);
            
            if (distToButter < 210 && !cat.sitting) {
                cat.watchingButterfly = true;
                cat.interestIntensity = Math.min(1, cat.interestIntensity + 0.025);
                let targetAngle = Math.atan2(dyToButter, dxToButter) * 0.4;
                cat.headAngle = cat.headAngle * 0.92 + targetAngle * 0.08;
                cat.bodyShift = cat.bodyShift * 0.94 + (dxToButter * 0.006);
                if (Math.random() < 0.005 && cat.pawSwipe <= 0 && !cat.sitting) {
                    cat.pawSwipe = 9;
                }
            } else {
                cat.watchingButterfly = false;
                cat.interestIntensity *= 0.96;
                cat.headAngle *= 0.97;
                cat.bodyShift *= 0.96;
            }
            cat.headAngle = Math.min(0.7, Math.max(-0.7, cat.headAngle));
            
            if (!cat.sitting) {
                let dx = cat.targetX - cat.x;
                let step = Math.min(0.85, Math.abs(dx) * 0.016);
                if (Math.abs(dx) > 1.2) cat.x += (dx > 0 ? step : -step);
                cat.walkCycle = (cat.walkCycle + 0.03) % (Math.PI * 2);
                cat.bodyBob = Math.sin(cat.walkCycle) * 0.7;
                cat.legPhase = (cat.legPhase + 0.05) % (Math.PI * 2);
                let tailSpeed = cat.fastWag ? 0.13 : 0.022;
                cat.tailAngle += tailSpeed * cat.tailDir;
                if (cat.tailAngle > 0.65) cat.tailDir = -1;
                if (cat.tailAngle < -0.65) cat.tailDir = 1;
            } else {
                cat.legPhase = Math.sin(Date.now() * 0.007) * 0.4;
                cat.tailAngle += 0.2 * cat.tailDir;
                if (cat.tailAngle > 0.9) cat.tailDir = -1;
                if (cat.tailAngle < -0.9) cat.tailDir = 1;
                cat.sitTimer--;
                if (cat.sitTimer <= 0) {
                    cat.sitting = false;
                    cat.fastWag = false;
                    chooseNewTarget();
                }
            }
            if (cat.blink <= 0 && Math.random() < 0.007) { cat.eyeClose = true; cat.blink = 8; }
            if (cat.blink > 0) { cat.blink--; if (cat.blink === 0) cat.eyeClose = false; }
        }
        
        function chooseNewTarget() {
            let newX = Math.min(width - 85, Math.max(70, Math.random() * (width - 140)));
            cat.targetX = newX;

        // 修改摸猫函数，加入音效播放
        function petCat(e) {
            const rect = canvas.getBoundingClientRect();
            let cx, cy;
            if (e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
            else { cx = e.clientX; cy = e.clientY; }
            const tx = cx - rect.left;
            const ty = cy - rect.top;
            const dx = tx - cat.x;
            const dy = ty - (cat.y - 22);
            if (Math.hypot(dx, dy) < 70) {
                // 播放音效
                if (typeof playCatSound === 'function') {
                    playCatSound();
                }
                if (!cat.sitting) {
                    cat.sitting = true;
                    cat.sitTimer = 70;
                    cat.fastWag = true;
                    cat.targetX = cat.x;
                    cat.pawSwipe = 14;
                    cat.tailDir *= -1;
                } else {
                    cat.sitTimer = Math.min(cat.sitTimer + 20, 95);
                    cat.pawSwipe = 12;
                }
                ctx.fillStyle = "rgba(255,120,150,0.9)";
                ctx.font = "24px 'Segoe UI'";
                ctx.fillText("❤️", cat.x - 18, cat.y - 55);
            }
        }
        
        function updateButterfly() {
            if (butterfly.hovered) return;
            const catCenterX = cat.x;
            const catCenterY = cat.y - 28;
            const maxSpeed = 1.0;
            if (butterfly.state === 'follow') {
                butterfly.angle += 0.008;
                let radius = 140 + Math.sin(Date.now() * 0.0016) * 18;
                let angleRad = butterfly.angle;
                let targetX = catCenterX + Math.cos(angleRad) * radius;
                let targetY = catCenterY - 10 + Math.sin(angleRad * 1.2) * 28;
                let dx = targetX - butterfly.x;
                let dy = targetY - butterfly.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 0.1) {
                    let move = Math.min(maxSpeed, dist * 0.04);
                    butterfly.x += (dx / dist) * move;
                    butterfly.y += (dy / dist) * move;
                }
                if (Math.random() < 0.0012) {
                    butterfly.state = 'free';
                    butterfly.stateTimer = 210 + Math.random() * 140;
                    let tries = 0;
                    do {
                        butterfly.freeTargetX = 60 + Math.random() * (width - 120);
                        butterfly.freeTargetY = 70 + Math.random() * (height - 150);
                        tries++;
                    } while ((isInsidePasswordBox(butterfly.freeTargetX, butterfly.freeTargetY) || butterfly.freeTargetY < 50) && tries < 20);
                }
            } else if (butterfly.state === 'free') {
                let dx = butterfly.freeTargetX - butterfly.x;
                let dy = butterfly.freeTargetY - butterfly.y;
                let dist = Math.hypot(dx, dy);
                if (dist < 22 || butterfly.stateTimer <= 0) {
                    butterfly.state = 'follow';
                    return;
                }
                butterfly.stateTimer--;
                let move = Math.min(maxSpeed * 0.85, dist * 0.028);
                if (dist > 0.01) {
                    butterfly.x += (dx / dist) * move;
                    butterfly.y += (dy / dist) * move;
                }
                butterfly.x += Math.sin(Date.now() * 0.007) * 0.25;
                butterfly.y += Math.cos(Date.now() * 0.006) * 0.25;
                butterfly.x = Math.min(width - 35, Math.max(25, butterfly.x));
                butterfly.y = Math.min(height - 50, Math.max(45, butterfly.y));
            }
            applyAvoidForce(butterfly, butterfly.x, butterfly.y, 0.4);
            butterfly.x = Math.min(width - 20, Math.max(18, butterfly.x));
            butterfly.y = Math.min(height - 35, Math.max(35, butterfly.y));
        }
        
        function updateJellyfish() {
            if (jellyfish.hovered) return;
            if (Math.random() < 0.0035) {
                let newX = 45 + Math.random() * (width - 90);
                let newY = 45 + Math.random() * (height * 0.38);
                let tries = 0;
                while ((isInsidePasswordBox(newX, newY) || newY > boxRect.y + boxRect.h + 5) && tries < 12) {
                    newX = 45 + Math.random() * (width - 90);
                    newY = 45 + Math.random() * (height * 0.38);

                jellyfish.targetX = newX;
                jellyfish.targetY = newY;
            }
            let dx = jellyfish.targetX - jellyfish.x;
            let dy = jellyfish.targetY - jellyfish.y;
            jellyfish.x += dx * 0.006;
            jellyfish.y += dy * 0.006;
            jellyfish.x += Math.sin(Date.now() * 0.0015) * 0.18;
            jellyfish.y += Math.cos(Date.now() * 0.0018) * 0.12;
            jellyfish.x = Math.min(width - 50, Math.max(35, jellyfish.x));
            jellyfish.y = Math.min(height * 0.55, Math.max(35, jellyfish.y));
            applyAvoidForce(jellyfish, jellyfish.x, jellyfish.y, 0.35);
            jellyfish.floatY += 0.022;
            jellyfish.pulse += 0.017;
            jellyfish.tentaclePhase += 0.007;
        }

        function addInteractions() {

            });

            particle.style.opacity = '1';
            document.body.appendChild(particle);
            const angle = Math.random() * Math.PI * 2;

            let x = centerX, y = centerY;
            let opacity = 1;
            const animateParticle = () => {
                x += Math.cos(angle) * speed;
                y += Math.sin(angle) * speed;
                opacity -= 0.02;
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.opacity = opacity;
                if (opacity > 0) requestAnimationFrame(animateParticle);
                else particle.remove();
            };
            requestAnimationFrame(animateParticle);
        }
    }

        function updateRocket(){ if(!rocketActive) return; rocketTail.push({x:rocketX,y:rocketY,life:0.8}); if(rocketTail.length>15) rocketTail.shift(); for(let t of rocketTail) t.life-=0.05; rocketY+=rocketVy; rocketVy+=0.28; if(rocketY<height*0.2||rocketVy>=0){ rocketActive=false; addFireworkExplosion(rocketX,rocketY); if(targetPoints.length){ isFormingChar=true; for(let i=0;i<Math.min(targetPoints.length,350);i++){ const t=targetPoints[i]; let col=Math.random()<0.6?"#6c9ebf":(Math.random()<0.85?"#b183c2":"#f5c89b"); charParticles.push({x:rocketX+(Math.random()-0.5)*180,y:rocketY+(Math.random()-0.5)*150,targetX:t.x,targetY:t.y,progress:0,speed:0.02+Math.random()*0.025,color:col,size:2.5+Math.random()*3,alpha:1}); } } addBlessing(width/2-60,height/2-80,"✨ "+getBlessing()+" ✨"+TARGET_CHAR); } }
        function drawRocket(){ if(!rocketActive) return; for(let t of rocketTail){ ctx.fillStyle=`rgba(255,120,50,${t.life*0.7})`; ctx.beginPath(); ctx.arc(t.x,t.y,5*t.life,0,Math.PI*2); ctx.fill(); } ctx.fillStyle="#f0a07c"; ctx.fillRect(rocketX-4,rocketY-10,8,18); ctx.fillStyle="#e85d3a"; ctx.beginPath(); ctx.moveTo(rocketX,rocketY-18); ctx.lineTo(rocketX-6,rocketY-8); ctx.lineTo(rocketX+6,rocketY-8); ctx.fill(); ctx.fillStyle="#ff8c42"; ctx.beginPath(); ctx.moveTo(rocketX-3,rocketY+6); ctx.lineTo(rocketX,rocketY+14); ctx.lineTo(rocketX+3,rocketY+6); ctx.fill(); }
        function updateCharParticles(){ let allFinished=true; for(let p of charParticles){ if(p.progress<1){ allFinished=false; p.progress+=p.speed; if(p.progress>1) p.progress=1; const e=p.progress; p.x=p.x+(p.targetX-p.x)*e*0.3; p.y=p.y+(p.targetY-p.y)*e*0.3; } else if(p.alpha>0) p.alpha-=0.008; } if(allFinished&&charParticles.length&&charParticles.every(p=>p.alpha<=0.02)){ charParticles=[]; isFormingChar=false; } }
        function drawCharParticles(){ for(let p of charParticles) if(p.alpha>0.02){ ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.alpha,0,Math.PI*2); ctx.fill(); } }
        function drawBackground(){ const grad=ctx.createLinearGradient(0,0,0,height); grad.addColorStop(0,"#b8a9d4"); grad.addColorStop(1,"#d6c6f0"); ctx.fillStyle=grad; ctx.fillRect(0,0,width,height); }
        function update(){ if(!isPageVisible) return; updateStars(); updateConfetti(); updateBlessings(); updateFireworks(); updateRocket(); updateCharParticles(); drawBackground(); drawStars(); drawConfetti(); drawBlessings(); drawFireworks(); drawCharParticles(); drawRocket(); animationId=requestAnimationFrame(update); }
        function onTap(e){ e.preventDefault(); let cx,cy; if(e.touches){ cx=e.touches[0].clientX; cy=e.touches[0].clientY; } else { cx=e.clientX; cy=e.clientY; } const rect=canvas.getBoundingClientRect(); const tx=cx-rect.left, ty=cy-rect.top; if(tx<0||tx>width||ty<0||ty>height) return; clickCount++; addConfetti(tx,ty); addBlessing(tx-15,ty-20,getBlessing()); if(clickCount===5){ launchRocket(); clickCount=0; } }
        document.addEventListener('visibilitychange',()=>{ isPageVisible=!document.hidden; if(isPageVisible&&!animationId) update(); else if(!isPageVisible&&animationId){ cancelAnimationFrame(animationId); animationId=null; } });
        window.addEventListener('resize',()=>{ resizeCanvas(); initStars(); if(TARGET_CHAR) sampleCharacterPoints(TARGET_CHAR); });
        resizeCanvas(); initStars(); if(TARGET_CHAR) sampleCharacterPoints(TARGET_CHAR);
        canvas.addEventListener('click',onTap); canvas.addEventListener('touchstart',onTap,{passive:false});
        update();
    }
</script>
